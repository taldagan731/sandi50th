name: Live post-deploy contribution check

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for the new production release
        shell: bash
        run: |
          for attempt in {1..30}; do
            release="$(curl -fsS https://www.sandi50th.com/api/release 2>/dev/null || true)"
            if echo "$release" | grep -q "private-story-studio-v1"; then exit 0; fi
            sleep 10
          done
          echo "Production did not reach the expected release in five minutes."
          exit 1
      - name: Verify text, direct media upload, backup, and noindex
        id: live_smoke
        run: node scripts/live-contribution-smoke.mjs
      - name: Publish smoke-test status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.live_smoke.outcome }}
        shell: bash
        run: |
          if [ "$OUTCOME" = "success" ]; then state=success; else state=failure; fi
          curl --fail-with-body -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}             -d "{\"state\":\"$state\",\"context\":\"live-contribution-smoke\",\"description\":\"Production upload, backup, and noindex check: $OUTCOME\"}"
